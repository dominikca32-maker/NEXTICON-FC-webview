name: Build portable EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout shell
        uses: actions/checkout@v4

      - name: Checkout NEXTICON FC (optional secret)
        if: ${{ secrets.GAME_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: dominikca32-maker/NEXTICON-FC
          ref: staging
          path: game
          token: ${{ secrets.GAME_REPO_TOKEN }}

      - name: Setup Node
        if: ${{ secrets.GAME_REPO_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        if: ${{ secrets.GAME_REPO_TOKEN != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Build game into wwwroot
        if: ${{ secrets.GAME_REPO_TOKEN != '' }}
        working-directory: game
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          Remove-Item -Recurse -Force ../wwwroot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path ../wwwroot | Out-Null
          Copy-Item -Path dist/* -Destination ../wwwroot -Recurse -Force

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish WebView host
        run: |
          dotnet publish src/NextIconFc.WebView/NextIconFc.WebView.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Stage wwwroot next to EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/wwwroot | Out-Null
          if (Test-Path wwwroot/index.html) {
            Copy-Item -Path wwwroot/* -Destination publish/wwwroot -Recurse -Force
          } else {
            Set-Content -Path publish/wwwroot/README.txt -Value @"
Copy NEXTICON FC dist/ contents into this wwwroot folder (index.html, assets, event-heroes), then start NextIconFC.exe.
"@
          }
          if (-not (Test-Path publish/NextIconFC.exe)) { throw "NextIconFC.exe missing" }

      - name: Zip portable package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath NEXTICON-FC-portable-win-x64.zip -Force
          Get-Item NEXTICON-FC-portable-win-x64.zip | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXTICON-FC-portable-win-x64
          path: NEXTICON-FC-portable-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-${{ github.run_number }}
          name: Portable win-x64 #${{ github.run_number }}
          body: |
            Portable **NEXTICON FC** for Windows (Edge WebView2).

            1. Unzip
            2. Run `NextIconFC.exe` (needs `wwwroot/` with the game build)
            3. [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/) usually already installed with Edge

            Full game bundle in CI requires repo secret `GAME_REPO_TOKEN` (PAT with access to private NEXTICON-FC).
            Without it, copy a local `dist/` into `wwwroot/` after unzip, or run `scripts/pack-local.ps1` on Windows.
          files: NEXTICON-FC-portable-win-x64.zip
          generate_release_notes: false
